schema_version: "1.1"
name: links-only-no-apify
expected_outcome: |
  The most common start: a user with no project context and no Apify access pastes creator links.
  The first reply says Apify isn't connected and that no verdict will be given from old or remembered
  numbers. It starts connecting the Apify MCP connector (https://mcp.apify.com): it runs or proposes the
  install (claude mcp add, or Settings → Connectors → Add custom connector, or a connector install card)
  and tells the user how to authorize it (/mcp → apify → Authenticate, or Connect → log in → Allow).
  In the same message it asks only for the product or campaign and the target buyer / ICP. Browser
  collection and uploads are mentioned only as fallbacks if the user won't use Apify. It does not ask
  for a price, rate, deliverables or budget, never asks for a token in chat, and shows no numbers,
  scores or verdicts for the creators.
